<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACS Smart Admin Panel</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-purple: #9d00ff;
            --dark-bg: #0a0a0c;
            --gold: #d4af37;
            --panel-bg: #1a1a2e;
            --success-green: #00c853;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: var(--dark-bg);
            color: white;
            padding: 20px;
        }

        /* --- Header & Search --- */
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--gold); margin: 0; font-size: 32px; text-transform: uppercase;}
        
        .controls {
            display: flex; gap: 15px; margin-bottom: 20px;
            flex-wrap: wrap; justify-content: center;
        }
        
        .search-box {
            padding: 15px; font-size: 18px; border-radius: 8px; border: 2px solid var(--neon-blue);
            background: #111; color: white; width: 100%; max-width: 400px; text-align: center;
        }

        /* --- Tabs --- */
        .tab-btn {
            padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer;
            border: none; border-radius: 8px; background: #222; color: white; transition: 0.3s;
        }
        .tab-btn.active { background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }

        /* --- List View --- */
        .list-container { max-width: 800px; margin: auto; }
        .list-item {
            background: var(--panel-bg); padding: 20px; border-radius: 10px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            border-left: 5px solid var(--neon-blue); transition: 0.2s;
        }
        .list-item:hover { transform: scale(1.02); background: #22223b; }
        .list-name { font-size: 24px; font-weight: bold; color: white; }
        .list-token { font-size: 20px; color: var(--gold); background: #111; padding: 5px 15px; border-radius: 5px;}

        /* --- Full Detail Modal --- */
        #detailModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: var(--panel-bg); width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto;
            padding: 30px; border-radius: 15px; border: 2px solid var(--neon-blue); position: relative;
        }
        
        .close-btn {
            position: absolute; top: 15px; right: 20px; background: red; color: white; border: none;
            font-size: 20px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold;
        }

        .detail-line { font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .detail-label { color: var(--gold); font-weight: bold; display: block; font-size: 16px; margin-bottom: 5px;}
        
        /* --- Action Buttons --- */
        .action-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;
        }
        .action-btn {
            padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
            text-align: center; text-decoration: none; display: block; color: white;
        }
        .btn-call { background: #007bff; }
        .btn-wa { background: #25D366; color: black; }
        .btn-email { background: #ff5722; }
        .btn-complete { background: var(--success-green); color: black; grid-column: span 2; font-size: 22px;}
        
        /* --- Photo Viewer --- */
        .photo-viewer {
            margin-top: 30px; border: 2px dashed #555; padding: 10px; text-align: center; border-radius: 10px;
        }
        .photo-viewer img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none;}
        .no-photo-msg { color: #aaa; font-size: 16px;}

    </style>
</head>
<body>

    <header>
        <h1>ACS Data Center 🗂️</h1>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search Token Number..." onkeyup="filterList()">
    </div>

    <div class="controls">
        <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">⏳ Pending Works</button>
        <button class="tab-btn" id="tabCompleted" onclick="switchTab('completed')">✅ Completed Works</button>
    </div>

    <div class="list-container" id="dataList">
        <h2 style="text-align: center; color: var(--gold);">Loading Data...</h2>
    </div>

    <div id="detailModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">X</button>
            <h2 style="color: var(--neon-blue); border-bottom: 2px solid; padding-bottom: 10px;">Customer Details</h2>
            
            <div id="modalBody">
                </div>

            <div class="action-grid" id="actionButtons">
                </div>

            <div class="photo-viewer" id="photoArea">
                <span class="detail-label">Attached Document/Photo:</span>
                <p class="no-photo-msg" id="photoNameTxt"></p>
                <img id="customerImage" src="" alt="Customer File">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDb0r-Gb77EeVwIFXXu6SKLvAeJK0wNUYA",
            authDomain: "acs-service-56f2b.firebaseapp.com",
            projectId: "acs-service-56f2b",
            storageBucket: "acs-service-56f2b.firebasestorage.app",
            messagingSenderId: "414923920620",
            appId: "1:414923920620:web:ae7a2025ed3d262d3501c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allRequests = [];
        let currentTab = 'pending';

        // Real-time listener from Firebase
        onSnapshot(collection(db, "service_requests"), (snapshot) => {
            allRequests = [];
            snapshot.forEach((doc) => {
                let data = doc.data();
                data.id = doc.id; 
                if(!data.status) data.status = 'pending'; 
                allRequests.push(data);
            });
            allRequests.sort((a, b) => b.timestamp - a.timestamp);
            renderList();
        });

        // Switch Tabs
        window.switchTab = function(status) {
            currentTab = status;
            document.getElementById('tabPending').classList.remove('active');
            document.getElementById('tabCompleted').classList.remove('active');
            
            if(status === 'pending') document.getElementById('tabPending').classList.add('active');
            else document.getElementById('tabCompleted').classList.add('active');
            
            renderList();
        }

        // Search Function
        window.filterList = function() { renderList(); }

        // Display the List
        function renderList() {
            const container = document.getElementById('dataList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = "";

            const filteredData = allRequests.filter(req => {
                const matchesTab = req.status === currentTab;
                const tokenSafe = (req.token || "").toLowerCase();
                const matchesSearch = tokenSafe.includes(searchQuery);
                return matchesTab && matchesSearch;
            });

            if(filteredData.length === 0) {
                container.innerHTML = `<h3 style="text-align: center; color: #777;">No ${currentTab} data found.</h3>`;
                return;
            }

            filteredData.forEach(req => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => openModal(req);
                item.innerHTML = `
                    <div class="list-name">👤 ${req.name || "Unknown"}</div>
                    <div class="list-token">${req.token || "N/A"}</div>
                `;
                container.appendChild(item);
            });
        }

        // Open Full Details Modal
        window.openModal = function(req) {
            const modal = document.getElementById('detailModal');
            const modalBody = document.getElementById('modalBody');
            const actionBtns = document.getElementById('actionButtons');
            const imgViewer = document.getElementById('customerImage');
            const photoNameTxt = document.getElementById('photoNameTxt');

            let dateString = req.timestamp ? req.timestamp.toDate().toLocaleString('en-IN') : "N/A";

            // Inject Details
            modalBody.innerHTML = `
                <div class="detail-line"><span class="detail-label">Token No:</span> ${req.token}</div>
                <div class="detail-line"><span class="detail-label">Date:</span> ${dateString}</div>
                <div class="detail-line"><span class="detail-label">Full Name:</span> ${req.name}</div>
                <div class="detail-line"><span class="detail-label">Mobile:</span> ${req.mobile || "N/A"}</div>
                <div class="detail-line"><span class="detail-label">Alt Mobile:</span> ${req.alt_mobile || "N/A"}</div>
                <div class="detail-line"><span class="detail-label">WhatsApp:</span> ${req.whatsapp || "N/A"}</div>
                <div class="detail-line"><span class="detail-label">Email:</span> ${req.email || "N/A"}</div>
                <div class="detail-line"><span class="detail-label">Service:</span> <span style="color:var(--neon-purple); font-weight:bold;">${req.service}</span></div>
                <div class="detail-line"><span class="detail-label">Description:</span> ${req.description || "N/A"}</div>
            `;

            // Inject Buttons
            let buttonsHTML = `
                <a href="tel:${req.mobile}" class="action-btn btn-call">📞 Call Main</a>
                <a href="https://wa.me/91${req.whatsapp}" target="_blank" class="action-btn btn-wa">💬 WhatsApp</a>
            `;
            if(req.alt_mobile) {
                buttonsHTML += `<a href="tel:${req.alt_mobile}" class="action-btn btn-call" style="background:#0056b3;">📞 Call Alt</a>`;
            }
            if(req.email) {
                buttonsHTML += `<a href="mailto:${req.email}" class="action-btn btn-email">📧 Email</a>`;
            }
            
            if(req.status === 'pending') {
                buttonsHTML += `<button onclick="markAsComplete('${req.id}')" class="action-btn btn-complete">✅ MARK AS COMPLETE</button>`;
            } else {
                buttonsHTML += `<button disabled class="action-btn btn-complete" style="background:#555;">File is Completed</button>`;
            }

            actionBtns.innerHTML = buttonsHTML;

            if (req.fileUrl) {
                imgViewer.src = req.fileUrl;
                imgViewer.style.display = 'block';
                photoNameTxt.style.display = 'none';
            } else if (req.file_name && req.file_name !== "No file attached") {
                imgViewer.style.display = 'none';
                photoNameTxt.style.display = 'block';
                photoNameTxt.innerHTML = `File Name: <strong>${req.file_name}</strong> <br><small>(Storage is not setup yet to view the actual photo)</small>`;
            } else {
                imgViewer.style.display = 'none';
                photoNameTxt.style.display = 'block';
                photoNameTxt.innerHTML = "No attachment provided.";
            }

            modal.style.display = 'flex';
        }

        // Close Modal
        window.closeModal = function() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // Mark Document as Complete
        window.markAsComplete = async function(docId) {
            const confirmAction = confirm("Are you sure you want to mark this request as completed?");
            if (confirmAction) {
                try {
                    const docRef = doc(db, "service_requests", docId);
                    await updateDoc(docRef, { status: 'completed' });
                    closeModal();
                } catch (error) {
                    console.error("Error updating document: ", error);
                    alert("Error moving file to Completed!");
                }
            }
        }
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('PWA ServiceWorker registered successful with scope: ', registration.scope);
                })
                .catch(err => {
                    console.log('PWA ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
